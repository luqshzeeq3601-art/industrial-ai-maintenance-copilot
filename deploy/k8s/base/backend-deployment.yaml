apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-backend
  namespace: industrial-copilot
  labels:
    app.kubernetes.io/name: copilot-backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: copilot-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copilot-backend
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: industrial-copilot-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http-api
          envFrom:
            - configMapRef:
                name: copilot-config
            - secretRef:
                name: copilot-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: vectorstore-storage
              mountPath: /app/vector_store
      volumes:
        - name: vectorstore-storage
          persistentVolumeClaim:
            claimName: copilot-vectorstore-pvc
