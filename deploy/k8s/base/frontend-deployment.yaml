apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-frontend
  namespace: industrial-copilot
  labels:
    app.kubernetes.io/name: copilot-frontend
    app.kubernetes.io/component: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: copilot-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copilot-frontend
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: frontend
          image: industrial-copilot-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-ui
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
