name: ci
on:
  push:
  pull_request:
  schedule: [{cron: "0 2 * * *"}]
jobs:
  backend-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: pip install -e . pytest
      - run: pytest backend/tests/test_api_contract.py backend/tests/test_v1_api.py -q -m "not slow"
  backend-slow-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      HF_HUB_CACHE: ~/.cache/huggingface
      HF_HUB_OFFLINE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('backend/app/rag/model_configs.py') }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: pip install -e . pytest
      - run: pytest backend/tests/ -q -m "slow" -p no:xdist
      # NOTE: embedding tests are serial (-p no:xdist) - parallel workers each
      # download 391 HF weights and OOM/timeout.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: industrial_maintenance
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >- --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: pip install -e . pytest psycopg2-binary
      - run: DATABASE_URL=postgresql://postgres:postgres@localhost:5432/industrial_maintenance python scripts/verify_postgres.py --verify-counts
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize deploy/k8s/base --output /tmp/kustomize.yaml && kubeconform -strict /tmp/kustomize.yaml
